name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout the proposed merge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Build, run unit tests and Android Lint
        run: >-
          bash ./gradlew --no-daemon --console=plain --stacktrace --continue
          testDebugUnitTest lintDebug assembleDebug compileDebugAndroidTestKotlin

      - name: Publish the test summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          reports = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, '0'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Android checks\n\n')
              if reports:
                  summary.write('| Tests | Failures | Errors | Skipped |\n|---:|---:|---:|---:|\n')
                  summary.write('| ' + ' | '.join(str(totals[k]) for k in totals) + ' |\n\n')
              else:
                  summary.write('No JUnit reports were produced. Check the build log.\n\n')
              summary.write('Android Lint and JUnit reports are attached as artifacts. '
                            'Android UI tests are compiled, not run; no vehicle is connected.\n')
          PY

      - name: Upload diagnostic reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-check-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
